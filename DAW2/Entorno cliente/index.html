<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="precioBase">Precio base (€):</label>
    <input type="number" id="precioBase" placeholder="0.00" step="0.01" min="0">

    <label for="tipoIVA">Tipo de IVA:</label>
    <select id="tipoIVA">
        <option value="21">General (21%)</option>
        <option value="10">Reducido (10%)</option>
        <option value="4">Superreducido (4%)</option>
    </select>

    <button id="btnCalcular">Calcular Ticket</button>

    <div id="ticket">
        <h3>--- TICKET DE COMPRA ---</h3>
        <p>Base Imponible: <span id="resBase">0.00</span> €</p>
        <p>IVA (<span id="resPorcentaje">21</span>%): <span id="resIVA">0.00</span> €</p>
        <hr>
        <p><strong>TOTAL: <span id="resTotal">0.00</span> €</strong></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
