<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="cantidad">Introduce 2 dígitos:</label>
    <input type="text" name="cantidad" title="Introduce 2 dígitos"pattern="[0-9][0-9]" required>
    <input type="text" pattern="[0-9]+" required>
    <input type="color" name="color" value="#ff0000">
    <input type="date" name="fecha" value="2024-01-01">
    <input type="email" name="correo" placeholder="Introduce tu correo electrónico">
    <input type="file" name="archivo" accept=".jpg, .jpeg, .png">
    <input type="range" name="rango" min="0" max="100">
    <input type="submit" value="Enviar">
    <input type="reset" value="Restablecer">
    <button type="submit">Enviar</button>
</body>
</html>
